<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8B7CF6">
<title>Spelling Star &#8226; Fill the Missing Letters</title>
<style>
  :root{
    --pink:#FF7EB6; --purple:#8B7CF6; --sun:#FFC93C; --mint:#2FCB9B;
    --sky:#4FBCEB; --ink:#2B2350; --good:#23B37E; --bad:#FF6B6B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Baloo 2","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(165deg,#FFE9F3 0%,#EDF1FF 42%,#E4FFF6 100%);
    min-height:100dvh; display:flex; justify-content:center; overflow-x:hidden;
    padding:0 0 env(safe-area-inset-bottom);
    -webkit-user-select:none; user-select:none;
  }
  .app{width:100%; max-width:760px; min-height:100dvh; display:flex; flex-direction:column; min-width:0}

  header{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:8px;
    padding:11px 12px 9px; background:rgba(255,255,255,.75);
    backdrop-filter:blur(12px); border-bottom:2px solid rgba(139,124,246,.16);
  }
  .back{display:flex; align-items:center; gap:5px; text-decoration:none; color:var(--ink);
    font-weight:800; font-size:14px; background:#fff; border:2px solid #EDE8FF;
    border-radius:999px; padding:8px 12px; box-shadow:0 3px 0 #EDE8FF; white-space:nowrap}
  .back:active{transform:translateY(2px); box-shadow:none}
  .title{flex:0 0 auto; font-weight:800; font-size:15.5px}
  .spacer{flex:1}
  .stars{display:flex; align-items:center; gap:4px; font-weight:800; font-size:16px;
    background:linear-gradient(135deg,#FFF3C9,#FFE28A); border-radius:999px;
    padding:7px 12px; box-shadow:0 3px 0 #F3CE5E}

  main{flex:1; padding:12px 14px 22px; display:flex; flex-direction:column; gap:11px; min-width:0}

  .meterrow{display:flex; justify-content:space-between; align-items:center;
    font-weight:800; font-size:12.5px; color:#6B6390; padding:0 2px}
  .bar{height:11px; border-radius:999px; background:#fff; overflow:hidden;
    box-shadow:inset 0 2px 0 rgba(43,35,80,.06)}
  .bar>i{display:block; height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,var(--mint),var(--sky),var(--purple)); transition:width .35s ease}

  .card{background:#fff; border-radius:28px; padding:14px 14px 16px; min-width:0; overflow:hidden;
    box-shadow:0 14px 34px rgba(88,70,160,.14), 0 3px 0 #EFEAFB;
    display:flex; flex-direction:column; gap:10px}

  .art{
    align-self:center; width:min(44vw,180px); aspect-ratio:1; border-radius:50%;
    display:grid; place-items:center;
    background:radial-gradient(circle at 32% 26%, #FFD9EA, #C9B8FF 58%, #9FE7FF 100%);
    box-shadow:0 9px 0 rgba(139,124,246,.18), inset 0 -8px 18px rgba(255,255,255,.5);
    animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;
  }
  .art svg{width:78%; height:78%; filter:drop-shadow(0 4px 6px rgba(43,35,80,.18))}
  @keyframes pop{from{transform:scale(.6) rotate(-8deg); opacity:0} to{transform:scale(1) rotate(0); opacity:1}}

  .hear{
    align-self:center; display:flex; align-items:center; gap:7px;
    font-family:inherit; font-weight:800; font-size:15px; color:#5B4FC4;
    background:#F1EDFF; border:none; border-radius:999px; padding:11px 20px;
    cursor:pointer; box-shadow:0 3px 0 #DDD5FB; min-height:46px;
  }
  .hear:active{transform:translateY(2px); box-shadow:none}

  .tiles{display:flex; flex-wrap:nowrap; justify-content:center; align-items:center; gap:6px; padding:4px 0; max-width:100%; overflow:hidden}
  .tile{
    flex:0 0 auto; display:grid; place-items:center;
    border-radius:11px; font-weight:800; line-height:1;
    transition:background .15s ease, border-color .15s ease, transform .12s ease;
  }
  .tile.fixed{background:#FBF9FF; border:3px solid #E4DDFF; color:#3A3163}
  .tile.blank{background:#F7F4FF; border:3px dashed #B9ACFF; color:#8B7CF6}
  .tile.blank.active{border-color:var(--pink); background:#FFF0F7;
    box-shadow:0 0 0 4px rgba(255,126,182,.16); transform:translateY(-2px)}
  .tile.blank.filled{background:#fff; border:3px solid var(--good); color:#0C6B4B}
  .tile.right{background:linear-gradient(180deg,#C8F7E4,#9BEBD0); border-color:var(--good); color:#0C6B4B}
  .tile.wrong{background:linear-gradient(180deg,#FFD9D9,#FFC3C3); border-color:var(--bad); color:#B3352F; animation:shake .34s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

  .hintline{text-align:center; font-size:13px; font-weight:800; color:#8E87AE; min-height:17px}

  .kb{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; width:100%}
  .key{
    font-family:inherit; font-weight:800; font-size:19px; color:var(--ink);
    width:100%; min-width:0; height:clamp(34px,10.5vw,50px);
    border-radius:14px; cursor:pointer; border:none;
    background:linear-gradient(180deg,#FFFFFF,#F4F1FF);
    box-shadow:0 4px 0 #E1DAFB, inset 0 0 0 2px #EDE8FF;
    display:grid; place-items:center; padding:0;
  }
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 #E1DAFB, inset 0 0 0 2px #EDE8FF}
  .key.wide{grid-column:span 2; font-size:14px; background:linear-gradient(180deg,#FFF0F6,#FFE1EE); box-shadow:0 4px 0 #F5C9DD, inset 0 0 0 2px #FFE1EE}

  .actions{display:flex; gap:9px; margin-top:2px}
  .btn{
    flex:1; font-family:inherit; font-weight:800; font-size:18px; color:#fff; border:none;
    border-radius:17px; min-height:56px; cursor:pointer;
    background:linear-gradient(135deg,#8B7CF6,#6C5CE7); box-shadow:0 5px 0 #5A4BD1;
    animation:popin .3s ease both;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 #5A4BD1}
  .btn.green{background:linear-gradient(135deg,#2FCB9B,#17A87B); box-shadow:0 5px 0 #128C66}
  @keyframes popin{from{transform:scale(.95); opacity:0} to{transform:scale(1); opacity:1}}

  .toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,26px);
    background:#2B2350; color:#fff; font-weight:800; font-size:15.5px; padding:12px 20px;
    border-radius:999px; opacity:0; pointer-events:none; transition:all .28s ease; z-index:60;
    max-width:90vw; text-align:center}
  .toast.on{opacity:1; transform:translate(-50%,0)}

  .confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50}
  .confetti i{position:absolute; width:10px; height:14px; border-radius:3px; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(660deg); opacity:.9}}

  .end{text-align:center; padding:16px 6px}
  .end .big{font-size:60px; line-height:1}
  .end h1{font-size:28px; margin:8px 0 2px}
  .end p{font-size:16.5px; color:#5E5680; font-weight:700; margin:6px 0 14px; line-height:1.55}
  .btnrow{display:flex; flex-direction:column; gap:11px}
  .cta{font-family:inherit; font-weight:800; font-size:18px; color:#fff; border:none;
    border-radius:19px; min-height:58px; cursor:pointer; text-decoration:none;
    display:grid; place-items:center; background:linear-gradient(135deg,#8B7CF6,#6C5CE7);
    box-shadow:0 5px 0 #5A4BD1}
  .cta.alt{background:linear-gradient(135deg,#2FCB9B,#17A87B); box-shadow:0 5px 0 #128C66}
  .cta.pink{background:linear-gradient(135deg,#FF9EC4,#FF7EB6); box-shadow:0 5px 0 #E85C9C}
  .cta:active{transform:translateY(3px)}

  footer{text-align:center; font-size:11.5px; color:#8E87AE; padding:4px 16px 14px; font-weight:700}
</style>

var stage = document.getElementById('stage');

var cur = null;
var firstTry = 0;

function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

function say(text, rate){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang='en-GB'; u.rate=rate||.78; u.pitch=1.05;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function confetti(){
  var box=document.createElement('div'); box.className='confetti';
  var c=['#FF7EB6','#FFC93C','#2FCB9B','#4FBCEB','#8B7CF6','#FF9A3C'];
  for(var i=0;i<42;i++){
    var p=document.createElement('i');
    p.style.left=Math.random()*100+'vw'; p.style.top='-20px';
    p.style.background=c[i%c.length];
    p.style.animationDuration=(0.9+Math.random()*1.1)+'s';
    p.style.animationDelay=(Math.random()*.25)+'s';
    if(Math.random()>.6) p.style.borderRadius='50%';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(function(){ box.remove(); }, 2400);
}
function toast(msg, ms){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('on'); });
  setTimeout(function(){ t.classList.remove('on'); setTimeout(function(){ t.remove(); },320); }, ms||1600);
}

/* ---------- which letters are missing ---------- */
function blankCount(len){
  if(len<=4) return 1;
  if(len<=6) return 2;
  if(len<=8) return 3;
  return 4;
}
function chooseBlanks(word){
  var len = word.length, blanks = [];
  if(mode === 'all'){
    for(var i=0;i<len;i++) blanks.push(i);
  } else {
    var need = blankCount(len);
    var pool = [];
    for(var k=1;k<len;k++) pool.push(k);
    shuffle(pool);
    blanks = pool.slice(0, Math.min(need, pool.length)).sort(function(a,b){return a-b;});
  }
  return blanks;
}

/* ---------- tile sizing shared by both draw functions ---------- */
function tileMetrics(len){
  var avail = Math.min(stage.clientWidth || 380, 700) - 34;
  var gap = len > 8 ? 4 : 6;
  var tw = Math.floor((avail - gap*(len-1)) / len);
  tw = Math.max(24, Math.min(tw, 54));
  return {tw: tw, gap: gap, fs: Math.round(tw*0.62)};
}

/* ================= render a question ================= */
function renderQuestion(){
  var item = WORDS[order[qi]];
  var word = item.w;
  var letters = word.split('');
  var blanks = chooseBlanks(word);
  cur = { word:word, letters:letters, blanks:blanks, filled:{}, active:blanks[0], attempts:0, done:false, revealed:{} };

  var art = ART[item.a] || ART.spoon;

  stage.innerHTML =
    '<div class="meterrow"><span>Word ' + (qi+1) + ' of ' + WORDS.length + '</span>'
    + '<span>Fill the missing letters</span></div>'
    + '<div class="bar"><i id="pbar" style="width:' + (qi/WORDS.length*100) + '%"></i></div>'
    + '<div class="card">'
    +   '<div class="art"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' + art + '</svg></div>'
    +   '<button class="hear" id="hear">&#128266; Hear the word</button>'
    +   '<div class="tiles" id="tiles"></div>'
    +   '<div class="hintline" id="hint">Look at the picture and spell the word</div>'
    +   '<div class="kb" id="kb"></div>'
    +   '<div class="actions" id="actions"></div>'
    + '</div>';

  document.getElementById('hear').addEventListener('click', function(){ say(word, .72); });
  drawTiles();
  drawKeyboard();
  setTimeout(function(){ say(word, .72); }, 350);
}

/* ---------- tiles ---------- */
function drawTiles(){
  var box = document.getElementById('tiles');
  if(!box) return;
  var m = tileMetrics(cur.letters.length);
  box.style.gap = m.gap + 'px';
  box.innerHTML = '';
  cur.letters.forEach(function(ch, i){
    var isBlank = cur.blanks.indexOf(i) > -1;
    var d = document.createElement('div');
    d.className = 'tile ' + (isBlank ? 'blank' : 'fixed');
    d.style.width = m.tw + 'px';
    d.style.height = Math.round(m.tw*1.22) + 'px';
    d.style.fontSize = m.fs + 'px';
    if(isBlank){
      if(cur.filled[i]){ d.textContent = cur.filled[i]; d.classList.add('filled'); }
      if(i === cur.active && !cur.done) d.classList.add('active');
    } else if(cur.revealed && cur.revealed[i]){
      d.textContent = cur.revealed[i].toUpperCase();
      d.style.color = '#C1741A';
      d.style.borderColor = '#FFC93C';
      d.style.background = '#FFF8E3';
    } else {
      d.textContent = ch.toUpperCase();   /* match the keyboard letters */
    }
    box.appendChild(d);
  });
}

/* ---------- keyboard ---------- */
function drawKeyboard(){
  var kb = document.getElementById('kb');
  if(!kb) return;
  kb.innerHTML = '';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function(L){
    var b = document.createElement('button');
    b.className = 'key'; b.type = 'button'; b.textContent = L;
    b.dataset.letter = L;
    b.addEventListener('click', function(){ typeLetter(L); });
    kb.appendChild(b);
  });
  var del = document.createElement('button');
  del.className = 'key wide'; del.type = 'button'; del.textContent = '\u232B Delete';
  del.addEventListener('click', backspace);
  kb.appendChild(del);
}

/* ---------- typing ---------- */
function typeLetter(L){
  if(!cur || cur.done || cur.locked) return;
  var idx = cur.active;
  if(idx === undefined || idx === null) return;
  cur.filled[idx] = L;
  var next = null;
  for(var i=0;i<cur.letters.length;i++){
    if(cur.blanks.indexOf(i) > -1 && !cur.filled[i]){ next = i; break; }
  }
  cur.active = next;
  drawTiles();
  if(next === null){
    cur.locked = true;                  /* no more taps while we check */
    setTimeout(function(){ cur.locked = false; checkAnswer(); }, 380);
  }
}
function backspace(){
  if(!cur || cur.done || cur.locked) return;
  var filledIdx = [];
  cur.blanks.forEach(function(i){ if(cur.filled[i]) filledIdx.push(i); });
  if(filledIdx.length === 0) return;
  var last = filledIdx[filledIdx.length-1];
  delete cur.filled[last];
  cur.active = last;
  drawTiles();
}
document.addEventListener('keydown', function(e){
  if(!cur) return;
  if(e.key === 'Backspace'){ e.preventDefault(); backspace(); return; }
  if(e.key === 'Enter'){
    e.preventDefault();
    if(cur.done){ var nb=document.getElementById('nextBtn'); if(nb) nb.click(); }
    else checkAnswer();
    return;
  }
  if(/^[a-zA-Z]$/.test(e.key)){
    var L = e.key.toUpperCase();
    var keys = document.querySelectorAll('.key');
    for(var i=0;i<keys.length;i++){ if(keys[i].dataset.letter === L){ keys[i].click(); return; } }
  }
});

/* ---------- check ---------- */
function checkAnswer(){
  if(!cur || cur.done) return;
  var allFilled = cur.blanks.every(function(i){ return !!cur.filled[i]; });
  if(!allFilled){ toast('Fill all the letters first!'); return; }

  var ok = cur.blanks.every(function(i){
    return cur.filled[i].toLowerCase() === cur.letters[i].toLowerCase();
  });

  if(ok){
    cur.done = true;
    stars++; starEl.textContent = stars;
    if(cur.attempts === 0) firstTry++;
    var tiles = document.querySelectorAll('.tile.blank');
    Array.prototype.forEach.call(tiles, function(t){ t.classList.add('right'); });
    confetti();
    say(cur.word + '. ' + cur.word + '.', .76);
    document.getElementById('hint').textContent = 'Correct - ' + cur.word;
    document.getElementById('hint').style.color = '#128C66';
    document.getElementById('kb').style.display = 'none';
    var box = document.querySelector('.actions');
    box.innerHTML = '';
    var nb = document.createElement('button');
    nb.className = 'btn green'; nb.id = 'nextBtn';
    nb.textContent = (qi === WORDS.length-1) ? 'Finish \u2b50' : 'Next word \u2192';
    nb.addEventListener('click', nextWord);
    box.appendChild(nb);
  } else {
    cur.attempts++;
    cur.locked = true;
    var tiles2 = document.querySelectorAll('.tile.blank');
    var wrongIdx = [];
    cur.blanks.forEach(function(i, n){
      if(cur.filled[i].toLowerCase() !== cur.letters[i].toLowerCase()){
        wrongIdx.push(i);
        if(tiles2[n]) tiles2[n].classList.add('wrong');
      }
    });
    toast(cur.attempts >= 2 ? 'Watch - I will show you a letter!' : 'Not quite. Look again!', 1500);
    setTimeout(function(){
      Array.prototype.forEach.call(tiles2, function(t){ t.classList.remove('wrong'); });
      /* keep the letters she got right, clear only the wrong ones */
      wrongIdx.forEach(function(i){ delete cur.filled[i]; });

      /* after 4 tries, show her the whole word and move on (never get stuck) */
      if(cur.attempts >= 4){ showTheAnswer(); return; }

      if(cur.attempts >= 2){ revealOne(); }
      else {
        cur.locked = false;
        cur.active = cur.blanks.filter(function(i){ return !cur.filled[i]; })[0];
        if(cur.active === undefined) cur.active = cur.blanks[0];
        drawTiles();
      }
    }, 800);
  }
}

/* after two wrong tries, show one more letter as help */
function revealOne(){
  var stillBlank = cur.blanks.filter(function(i){ return !cur.filled[i] || cur.filled[i].toLowerCase() !== cur.letters[i].toLowerCase(); });
  if(stillBlank.length <= 1){
    /* last letter: show it so she is never stuck, but she still types it herself */
    if(stillBlank.length === 1){
      var only = stillBlank[0];
      cur.revealed = cur.revealed || {};
      cur.revealed[only] = cur.letters[only];
      cur.filled = {};
      cur.active = only;
      cur.locked = false;
      drawTiles();
      document.getElementById('hint').textContent = 'The letter is "' + cur.letters[only].toUpperCase() + '" - tap it below';
      document.getElementById('hint').style.color = '#C1741A';
    } else {
      cur.locked = false;
      cur.active = cur.blanks.filter(function(i){ return !cur.filled[i]; })[0];
      if(cur.active === undefined) cur.active = cur.blanks[0];
      drawTiles();
    }
    return;
  }
  var showIdx = stillBlank[0];
  cur.revealed = cur.revealed || {};
  cur.revealed[showIdx] = cur.letters[showIdx];
  cur.blanks = cur.blanks.filter(function(i){ return i !== showIdx; });
  delete cur.filled[showIdx];
  cur.locked = false;
  cur.active = cur.blanks.filter(function(i){ return !cur.filled[i]; })[0];
  if(cur.active === undefined) cur.active = cur.blanks[0];
  drawTiles();
}

/* give the word away, show it, and move on - no star for this one */
function showTheAnswer(){
  cur.done = true;
  cur.locked = true;
  cur.revealed = {};
  cur.blanks.forEach(function(i){ cur.filled[i] = cur.letters[i]; });
  drawTiles();                       /* redraw with the real letters, not her guess */
  var tiles = document.querySelectorAll('.tile.blank');
  Array.prototype.forEach.call(tiles, function(t){
    t.classList.add('right');
    t.style.background = 'linear-gradient(180deg,#FFEFC9,#FFE0A3)';
    t.style.borderColor = '#FFC93C';
    t.style.color = '#8A5A00';
  });
  document.getElementById('hint').textContent = 'This word is "' + cur.word + '" - remember it!';
  document.getElementById('hint').style.color = '#C1741A';
  document.getElementById('kb').style.display = 'none';
  say(cur.word + '. ' + cur.word + '.', .72);
  var box = document.querySelector('.actions');
  box.innerHTML = '';
  var nb = document.createElement('button');
  nb.className = 'btn green'; nb.id = 'nextBtn';
  nb.textContent = (qi === WORDS.length-1) ? 'Finish \u2b50' : 'Next word \u2192';
  nb.addEventListener('click', nextWord);
  box.appendChild(nb);
}

function nextWord(){
  qi++;
  if(qi >= WORDS.length){ renderEnd(); return; }
  renderQuestion();
}

/* ================= end screen ================= */
function renderEnd(){
  stage.innerHTML =
    '<div class="card end">'
    + '<div class="big">&#127942;</div>'
    + '<h1>Super spelling!</h1>'
    + '<p>You earned <strong id="st">' + stars + '</strong> of ' + WORDS.length + ' stars &#11088;<br>'
    +   '<span style="font-size:15px">' + firstTry + ' words spelled right first time</span></p>'
    + '<div class="btnrow">'
    +  '<button class="cta" id="again">Play again &#128260;</button>'
    +  '<button class="cta pink" id="hard">Try whole words (harder) &#9997;&#65039;</button>'
    +  '<a class="cta alt" href="writing.html">Next game: Creative Writing &#10133;</a>'
    +  '<a class="cta" style="background:linear-gradient(135deg,#B9ACFF,#8B7CF6);box-shadow:0 5px 0 #7A6AE0" href="index.html">Home &#127968;</a>'
    + '</div></div>';
  confetti(); setTimeout(confetti, 500);
  say('Super spelling! You earned ' + stars + ' stars!');
  document.getElementById('again').addEventListener('click', function(){ restart('some'); });
  document.getElementById('hard').addEventListener('click', function(){ restart('all'); });
}

function restart(m){
  mode = m;
  stars = 0; firstTry = 0; starEl.textContent = 0; qi = 0;
  order = shuffle(WORDS.map(function(_, i){ return i; }));
  renderQuestion();
  if(m === 'all') toast('Whole word mode - every letter is missing!', 2200);
}

/* ================= go ================= */
order = shuffle(WORDS.map(function(_, i){ return i; }));
renderQuestion();
</script>
