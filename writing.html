<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2FCB9B">
<title>Instruction Hero — Creative Writing</title>
<style>
  :root{
    --pink:#FF7EB6; --purple:#8B7CF6; --sun:#FFC93C; --mint:#2FCB9B;
    --sky:#4FBCEB; --ink:#2B2350; --good:#23B37E; --bad:#FF6B6B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Baloo 2","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(165deg,#E4FFF6 0%,#EDF1FF 45%,#FFE9F3 100%);
    min-height:100dvh; display:flex; justify-content:center;
    padding:0 0 env(safe-area-inset-bottom);
  }
  .app{width:100%; max-width:760px; min-height:100dvh; display:flex; flex-direction:column}

  header{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
    padding:12px 14px 10px; background:rgba(255,255,255,.72);
    backdrop-filter:blur(12px); border-bottom:2px solid rgba(47,203,155,.18);
  }
  .back{display:flex; align-items:center; gap:6px; text-decoration:none; color:var(--ink);
    font-weight:800; font-size:15px; background:#fff; border:2px solid #DDF5EC;
    border-radius:999px; padding:9px 14px; box-shadow:0 3px 0 #DDF5EC}
  .back:active{transform:translateY(2px); box-shadow:none}
  .title{flex:1; font-weight:800; font-size:17px}
  .stars{display:flex; align-items:center; gap:5px; font-weight:800; font-size:17px;
    background:linear-gradient(135deg,#FFF3C9,#FFE28A); border-radius:999px;
    padding:8px 14px; box-shadow:0 3px 0 #F3CE5E}

  main{flex:1; padding:16px 16px 30px; display:flex; flex-direction:column; gap:14px}

  .banner{
    border-radius:24px; padding:16px 18px; color:#fff;
    background:linear-gradient(135deg,#2FCB9B,#4FBCEB);
    box-shadow:0 8px 0 rgba(23,168,123,.35);
  }
  .banner h2{margin:0 0 4px; font-size:20px}
  .banner p{margin:0; font-size:15px; font-weight:700; opacity:.95; line-height:1.4}

  .card{background:#fff; border-radius:28px; padding:16px 16px 20px;
    box-shadow:0 14px 34px rgba(40,120,100,.13), 0 3px 0 #E6F7F1;
    display:flex; flex-direction:column; gap:12px}

  .q{font-size:clamp(19px,4.6vw,24px); font-weight:800; text-align:center; margin:2px 0 6px; line-height:1.35}
  .q small{display:block; font-size:14px; font-weight:700; color:#7B7398; margin-top:6px}

  /* order steps */
  .steps{display:flex; flex-direction:column; gap:10px}
  .step{
    display:flex; align-items:center; gap:12px; text-align:left;
    font-family:inherit; font-size:17px; font-weight:800; line-height:1.3;
    background:linear-gradient(180deg,#FFFFFF,#F6F3FF);
    border:3px solid #E4DDFF; border-radius:20px; color:var(--ink);
    box-shadow:0 5px 0 #E4DDFF; padding:12px 14px; cursor:pointer; min-height:62px;
  }
  .step:active{transform:translateY(3px); box-shadow:0 2px 0 #E4DDFF}
  .step .num{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%;
    display:grid; place-items:center; font-size:16px; font-weight:800;
    background:#EFEAFF; color:#8B7CF6; border:2px dashed #CFC2FF;
  }
  .step.picked{background:linear-gradient(180deg,#C8F7E4,#9BEBD0); border-color:#23B37E; box-shadow:0 5px 0 #23B37E}
  .step.picked .num{background:#23B37E; color:#fff; border:2px solid #23B37E}
  .step.ok{background:linear-gradient(180deg,#C8F7E4,#9BEBD0); border-color:#23B37E}
  .step.no{background:linear-gradient(180deg,#FFD9D9,#FFC3C3); border-color:#E25555; animation:shake .38s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

  /* verb chips */
  .chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
  .chip{
    font-family:inherit; font-size:19px; font-weight:800; letter-spacing:.3px;
    min-height:58px; padding:10px 22px; border-radius:20px; cursor:pointer;
    background:linear-gradient(180deg,#FFFFFF,#F1FBF7);
    border:3px solid #CFF0E4; color:var(--ink); box-shadow:0 5px 0 #CFF0E4;
  }
  .chip:active{transform:translateY(3px); box-shadow:0 2px 0 #CFF0E4}
  .chip.ok{background:linear-gradient(180deg,#C8F7E4,#9BEBD0); border-color:#23B37E; box-shadow:0 5px 0 #23B37E; color:#0C6B4B}
  .chip.no{background:linear-gradient(180deg,#FFD9D9,#FFC3C3); border-color:#E25555; box-shadow:0 5px 0 #E25555; animation:shake .38s}

  .sentence{font-size:clamp(20px,5vw,26px); font-weight:800; text-align:center; line-height:1.4; margin:4px 0}
  .gap{display:inline-block; min-width:96px; border-bottom:5px dotted var(--mint); color:#23B37E}

  /* builder rows */
  .row{
    background:#FAF8FF; border:2px dashed #E2DAFB; border-radius:20px; padding:12px;
    display:flex; flex-direction:column; gap:10px;
  }
  .rowline{font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .pill{
    font-family:inherit; font-weight:800; font-size:15px; padding:8px 14px; border-radius:999px;
    border:2px solid #EDE8FF; background:#fff; color:#5B4FC4; cursor:pointer; min-height:44px;
  }
  .pill.on{background:#8B7CF6; color:#fff; border-color:#8B7CF6}
  .pill.verb{border-color:#FCE3C0; color:#B4741A}
  .pill.verb.on{background:#FFB240; border-color:#FFB240; color:#4A2C00}
  .obj{font-weight:800; color:#3B3360}

  .btn{
    font-family:inherit; font-weight:800; font-size:19px; color:#fff; border:none;
    border-radius:20px; min-height:60px; cursor:pointer; padding:0 20px;
    background:linear-gradient(135deg,#8B7CF6,#6C5CE7); box-shadow:0 6px 0 #5A4BD1;
    animation:popin .3s ease both;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 3px 0 #5A4BD1}
  .btn.green{background:linear-gradient(135deg,#2FCB9B,#17A87B); box-shadow:0 6px 0 #128C66}
  .btn.pink{background:linear-gradient(135deg,#FF9EC4,#FF7EB6); box-shadow:0 6px 0 #E85C9C}
  @keyframes popin{from{transform:scale(.94); opacity:0} to{transform:scale(1); opacity:1}}

  .tip{background:#FFF8E3; border-left:6px solid #FFC93C; border-radius:14px;
    padding:10px 14px; font-size:14.5px; font-weight:700; color:#6B5316; line-height:1.45}
  .tip b{color:#2B2350}

  .model{background:#EFFBF6; border:2px solid #BEEBDA; border-radius:18px; padding:12px 14px;
    font-size:16px; font-weight:700; line-height:1.7; color:#175C46}
  .model b{color:#0C6B4B}

  .toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,26px);
    background:#2B2350; color:#fff; font-weight:800; font-size:16px; padding:12px 20px;
    border-radius:999px; opacity:0; pointer-events:none; transition:all .28s ease; z-index:60;
    max-width:90vw; text-align:center}
  .toast.on{opacity:1; transform:translate(-50%,0)}

  .confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50}
  .confetti i{position:absolute; width:10px; height:14px; border-radius:3px; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(660deg); opacity:.9}}

  .end{text-align:center; padding:16px 6px}
  .end .big{font-size:62px; line-height:1}
  .end h1{font-size:28px; margin:8px 0 4px}
  .end p{font-size:17px; color:#5E5680; font-weight:700; margin:6px 0 16px}
  .btnrow{display:flex; flex-direction:column; gap:12px}
  .cta{font-family:inherit; font-weight:800; font-size:19px; color:#fff; border:none;
    border-radius:20px; min-height:60px; cursor:pointer; text-decoration:none;
    display:grid; place-items:center; background:linear-gradient(135deg,#8B7CF6,#6C5CE7);
    box-shadow:0 6px 0 #5A4BD1}
  .cta.alt{background:linear-gradient(135deg,#2FCB9B,#17A87B); box-shadow:0 6px 0 #128C66}
  .cta.pink{background:linear-gradient(135deg,#FF9EC4,#FF7EB6); box-shadow:0 6px 0 #E85C9C}
  .cta:active{transform:translateY(3px)}

  footer{text-align:center; font-size:12px; color:#8E87AE; padding:6px 16px 18px; font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="index.html">&#8592; Home</a>
    <div class="title">Instruction Hero</div>
    <div class="stars">&#11088; <span id="starCount">0</span></div>
  </header>
  <main id="stage"></main>
  <footer>Order words &middot; bossy verbs &middot; Unit 4</footer>
</div>

<script>
var stage = document.getElementById('stage');
var starEl = document.getElementById('starCount');
var stars = 0;

function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); requestAnimationFrame(function(){t.classList.add('on');});
  setTimeout(function(){ t.classList.remove('on'); setTimeout(function(){t.remove();},320); },1800);
}
function confetti(){
  var box=document.createElement('div'); box.className='confetti';
  var c=['#FF7EB6','#FFC93C','#2FCB9B','#4FBCEB','#8B7CF6','#FF9A3C'];
  for(var i=0;i<44;i++){
    var p=document.createElement('i');
    p.style.left=Math.random()*100+'vw'; p.style.top='-20px';
    p.style.background=c[i%c.length];
    p.style.animationDuration=(.9+Math.random()*1.1)+'s';
    p.style.animationDelay=(Math.random()*.25)+'s';
    if(Math.random()>.6) p.style.borderRadius='50%';
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(function(){box.remove();},2400);
}
function say(text){
  if(!('speechSynthesis' in window)) return;
  try{ window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang='en-GB'; u.rate=.88; u.pitch=1.06;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ LEVEL 1 : put the steps in order ============ */
var ORDER_TASKS = [
  { title:'Make a jam sandwich', task:'How to make a jam sandwich',
    steps:[ 'cut two slices of bread', 'spread butter on the bread', 'add jam on top', 'put the slices together' ],
    words:['First','Next','Then','Finally'],
    art:'&#127838;' },
  { title:'Make a cup of tea', task:'How to make a cup of tea',
    steps:[ 'pour water into the kettle', 'boil the water', 'put a tea bag in the cup', 'add milk and mix' ],
    words:['First','Next','Then','Finally'],
    art:'&#9749;' },
  { title:'Plant a seed', task:'How to plant a seed',
    steps:[ 'dig a small hole', 'drop the seed in', 'cover it with soil', 'pour water on it' ],
    words:['First','Next','Then','Finally'],
    art:'&#127793;' },
  { title:'Wash your hands', task:'How to wash your hands',
    steps:[ 'turn on the tap', 'rub in the soap', 'rinse with water', 'dry with a towel' ],
    words:['First','Next','Then','Finally'],
    art:'&#129530;' }
];

var l1 = { idx:0, chosen:[], order:[] };

function level1(taskIdx){
  l1.idx = taskIdx % ORDER_TASKS.length;
  var T = ORDER_TASKS[l1.idx];
  l1.chosen = [];
  l1.order = shuffle(T.steps.map(function(_,i){return i;}));

  stage.innerHTML =
    '<div class="banner"><h2>' + T.art + ' ' + T.title + '</h2>'
    + '<p>Tap the steps in the right order: <b>First &rarr; Next &rarr; Then &rarr; Finally</b></p></div>'
    + '<div class="card"><div class="q">What happens first?<small>Tap a step to give it a number.</small></div>'
    + '<div class="steps" id="steps"></div>'
    + '<div class="tip"><b>Remember:</b> instructions go in the order you really do them &mdash; start at the beginning!</div>'
    + '<button class="btn" id="check" style="display:none">Check my order &#10003;</button>'
    + '</div>';

  drawSteps(T);
}

function drawSteps(T){
  var box = document.getElementById('steps');
  box.innerHTML = '';
  l1.order.forEach(function(si){
    var pos = l1.chosen.indexOf(si);
    var b = document.createElement('button');
    b.className = 'step' + (pos > -1 ? ' picked' : '');
    b.type = 'button';
    b.innerHTML = '<span class="num">' + (pos > -1 ? (pos+1) : '?') + '</span>'
      + '<span>' + (pos > -1 ? '<b style="color:#0C6B4B">' + T.words[pos] + ',</b> ' : '') + T.steps[si] + '</span>';
    b.addEventListener('click', function(){
      if(b.dataset.locked) return;
      var at = l1.chosen.indexOf(si);
      if(at > -1){ l1.chosen.splice(at,1); }
      else { l1.chosen.push(si); }
      drawSteps(T);
      document.getElementById('check').style.display = l1.chosen.length === T.steps.length ? 'block' : 'none';
      var c = document.getElementById('check');
      if(l1.chosen.length === T.steps.length){ c.style.display='block'; }
      if(at === -1 && l1.chosen.length === T.steps.length){
        say(T.words[0] + ', ' + T.steps[l1.chosen[0]]);
      }
    });
    box.appendChild(b);
  });

  var chk = document.getElementById('check');
  if(chk) chk.style.display = l1.chosen.length === T.steps.length ? 'block' : 'none';
}

document.addEventListener('click', function(e){
  if(e.target && e.target.id === 'check'){
    var T = ORDER_TASKS[l1.idx];
    var right = l1.chosen.every(function(v,i){ return v === i; });
    var btns = document.querySelectorAll('.step');
    if(right){
      stars++; starEl.textContent = stars; confetti();
      Array.prototype.forEach.call(btns, function(b){ b.classList.add('ok'); b.dataset.locked='1'; });
      document.getElementById('check').outerHTML = '<button class="btn green" id="l1next">Great! Next task &#8594;</button>';
      say('First, ' + T.steps[0] + '. Next, ' + T.steps[1] + '. Then, ' + T.steps[2] + '. Finally, ' + T.steps[3] + '.');
    } else {
      Array.prototype.forEach.call(btns, function(b){ b.classList.add('no'); });
      setTimeout(function(){ Array.prototype.forEach.call(btns, function(b){ b.classList.remove('no'); }); }, 500);
      toast('Not quite — think about what you do first!');
      l1.chosen = []; drawSteps(T);
    }
  }
  if(e.target && e.target.id === 'l1next'){
    if(l1.idx + 1 < ORDER_TASKS.length) level1(l1.idx + 1);
    else level2(0);
  }
});

/* ============ LEVEL 2 : bossy verb ============ */
var VERB_QS = [
  { before:'___ the water into the cup.', a:'pour',   opts:['pour','pours','pouring'], tip:'Bossy verbs stay plain: pour, not pours or pouring.' },
  { before:'___ the bread into small pieces.', a:'cut', opts:['cut','cuts','cutting'] },
  { before:'___ the jam on the bread.', a:'spread', opts:['spread','spreads','spreading'] },
  { before:'___ some milk to the tea.', a:'add',   opts:['add','adds','adding'] },
  { before:'___ the egg with a fork.', a:'mix',   opts:['mix','mixes','mixing'] },
  { before:'___ the seed in the hole.', a:'put',  opts:['put','puts','putting'] },
  { before:'___ the door slowly.', a:'open',      opts:['open','opens','opening'] },
  { before:'___ the paper in half.', a:'fold',    opts:['fold','folds','folding'] },
  { before:'___ the water until it boils.', a:'heat', opts:['heat','heats','heating'] },
  { before:'___ the picture with your pencil.', a:'draw', opts:['draw','draws','drawing'] }
];
var l2i = 0;

function level2(i){
  l2i = i;
  if(i >= VERB_QS.length){ return level3(); }
  var q = VERB_QS[i];
  stage.innerHTML =
    '<div class="banner"><h2>&#128221; Bossy verbs</h2>'
    + '<p>A <b>bossy verb</b> starts an instruction. It tells you exactly what to do.</p></div>'
    + '<div class="card">'
    + '<div class="q">Which word fits? <small>Question ' + (i+1) + ' of ' + VERB_QS.length + '</small></div>'
    + '<p class="sentence" id="sen">' + q.before.replace('___','<span class="gap" id="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>') + '</p>'
    + '<div class="chips" id="chips"></div>'
    + (q.tip ? '<div class="tip"><b>Tip:</b> ' + q.tip + '</div>' : '')
    + '</div>';

  var box = document.getElementById('chips');
  shuffle(q.opts.slice()).forEach(function(o){
    var b = document.createElement('button');
    b.className = 'chip'; b.type='button'; b.textContent = o;
    b.addEventListener('click', function(){
      if(box.dataset.done) return;
      box.dataset.done = '1';
      var gap = document.getElementById('gap');
      if(o === q.a){
        stars++; starEl.textContent = stars;
        b.classList.add('ok'); gap.textContent = q.a;
        confetti(); say(q.a + '. ' + q.a.charAt(0).toUpperCase() + q.a.slice(1) + ' the rest.');
        Array.prototype.forEach.call(box.children, function(c){ if(c!==b) c.style.opacity='.45'; });
        nextBtn(i);
      } else {
        b.classList.add('no');
        Array.prototype.forEach.call(box.children, function(c){ if(c.textContent === q.a) c.classList.add('ok'); });
        toast('Bossy verbs are plain: "' + q.a + '"');
        say('The bossy verb is ' + q.a);
        setTimeout(function(){ nextBtn(i); }, 1100);
      }
    });
    box.appendChild(b);
  });
}

function nextBtn(i){
  var c = document.createElement('button');
  c.className='btn'; c.style.marginTop='14px';
  c.textContent = (i + 1 >= VERB_QS.length) ? 'Now build your own! \u2192' : 'Next \u2192';
  c.addEventListener('click', function(){ level2(i+1); });
  stage.querySelector('.card').appendChild(c);
  c.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ============ LEVEL 3 : build your own instructions ============ */
var BUILD = {
  task:'Make a fruit salad',
  rows:[
    { obj:'the fruit into small pieces', verb:'cut'   },
    { obj:'the fruit into a bowl',       verb:'put'   },
    { obj:'some honey on top',           verb:'add'   },
    { obj:'everything together',         verb:'mix'   }
  ],
  orders:['First','Next','Then','Finally'],
  verbs:['cut','put','add','mix','pour','spread'],
  model:'<b>How to make a fruit salad</b><br>First, <b>cut</b> the fruit into small pieces.<br>Next, <b>put</b> the fruit into a bowl.<br>Then, <b>add</b> some honey on top.<br>Finally, <b>mix</b> everything together.'
};

function level3(){
  var state = BUILD.rows.map(function(){ return {o:null, v:null}; });

  stage.innerHTML =
    '<div class="banner"><h2>&#127817; Now write like a chef!</h2>'
    + '<p>Task: <b>' + BUILD.task + '</b>. Pick an order word and a bossy verb for each step.</p></div>'
    + '<div class="card" id="buildCard">'
    + '<div class="q">Tap one purple word + one orange word in each step.</div>'
    + '<div id="rows" style="display:flex;flex-direction:column;gap:12px"></div>'
    + '<button class="btn green" id="bcheck">Check my instructions &#10003;</button>'
    + '<div class="tip"><b>Every instruction needs:</b> an <b>order word</b> (First / Next / Then / Finally) + a <b>bossy verb</b> + what to do.</div>'
    + '</div>';

  var rowsBox = document.getElementById('rows');
  BUILD.rows.forEach(function(r, ri){
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<div class="rowline" id="line' + ri + '"><span class="obj">' + (ri+1) + '. ...</span></div>'
      + '<div class="rowline" id="ord' + ri + '"></div>'
      + '<div class="rowline" id="vrb' + ri + '"></div>';

    var ordBox = row.querySelector('#ord' + ri);
    BUILD.orders.forEach(function(o){
      var p = document.createElement('button');
      p.className='pill'; p.type='button'; p.textContent=o;
      p.addEventListener('click', function(){
        if(row.dataset.locked) return;
        state[ri].o = o;
        Array.prototype.forEach.call(ordBox.children, function(c){ c.classList.remove('on'); });
        p.classList.add('on'); refresh();
      });
      ordBox.appendChild(p);
    });

    var vrbBox = row.querySelector('#vrb' + ri);
    BUILD.verbs.forEach(function(v){
      var p = document.createElement('button');
      p.className='pill verb'; p.type='button'; p.textContent=v;
      p.addEventListener('click', function(){
        if(row.dataset.locked) return;
        state[ri].v = v;
        Array.prototype.forEach.call(vrbBox.children, function(c){ c.classList.remove('on'); });
        p.classList.add('on'); refresh();
      });
      vrbBox.appendChild(p);
    });

    rowsBox.appendChild(row);
  });

  function refresh(){
    BUILD.rows.forEach(function(r, ri){
      var line = document.getElementById('line' + ri);
      var s = state[ri];
      line.innerHTML = '<span class="obj">' + (ri+1) + '. ' + (s.o ? s.o + ', ' : '') 
        + '<span style="color:#B4741A">' + (s.v ? s.v : '___') + '</span> ' + r.obj + '</span>';
    });
  }
  refresh();

  document.getElementById('bcheck').addEventListener('click', function(){
    var bad = [];
    state.forEach(function(s, i){
      if(s.o !== BUILD.orders[i] || s.v !== BUILD.rows[i].verb) bad.push(i+1);
    });
    if(bad.length === 0){
      stars += 2; starEl.textContent = stars; confetti(); setTimeout(confetti, 450);
      say('First, cut the fruit. Next, put the fruit into a bowl. Then, add some honey. Finally, mix everything together.');
      document.querySelectorAll('.pill').forEach(function(p){ p.style.pointerEvents='none'; });
      var card = document.getElementById('buildCard');
      var done = document.createElement('div');
      done.className='model';
      done.innerHTML = '<div style="font-size:17px;margin-bottom:6px">&#127881; Perfect instructions!</div>' + BUILD.model;
      card.appendChild(done);
      var nb = document.createElement('button');
      nb.className='btn'; nb.textContent='Finish \ud83c\udfc6';
      nb.addEventListener('click', finish);
      card.appendChild(nb);
      document.getElementById('bcheck').remove();
      nb.scrollIntoView({behavior:'smooth', block:'center'});
    } else {
      toast('Check step ' + bad.join(' and ') + ' again!');
      bad.forEach(function(n){
        var row = document.querySelectorAll('.row')[n-1];
        row.classList.add('no');
        setTimeout(function(){ row.classList.remove('no'); }, 600);
      });
    }
  });
}

function finish(){
  stage.innerHTML =
    '<div class="card end">'
    + '<div class="big">&#127942;</div>'
    + '<h1>Instruction Hero!</h1>'
    + '<p>You earned <strong>' + stars + '</strong> stars &#11088;<br>You can use order words and bossy verbs now.</p>'
    + '<div class="btnrow">'
    +  '<button class="cta" id="again">Play again &#128260;</button>'
    +  '<a class="cta alt" href="spelling.html">Spelling game &#9997;&#65039;</a>'
    +  '<a class="cta pink" href="index.html">Home &#127968;</a>'
    + '</div></div>';
  confetti(); setTimeout(confetti, 520);
  say('Well done! You earned ' + stars + ' stars. You are an instruction hero!');
  document.getElementById('again').addEventListener('click', function(){
    stars = 0; starEl.textContent = 0; level1(0);
  });
}

/* start */
level1(0);
</script>
</body>
